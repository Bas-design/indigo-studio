<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indigo Studio</title>
<link rel="icon" type="image/svg+xml" href="/assets/Indigo-mark.svg">
<link rel="stylesheet" href="/studio/studio.css">
</head>
<body>

<header class="bar">
  <a class="bar__brand" href="#list">
    <img src="/assets/Indigo-mark.svg" alt="" width="22" height="24">
    <span>Indigo <strong>Studio</strong></span>
  </a>

  <nav class="bar__nav">
    <a href="#list" data-nav="list">Projects</a>
    <a href="#testimonials" data-nav="testimonials">Testimonials</a>
    <a href="/" target="_blank" rel="noopener">View site&nbsp;↗</a>
  </nav>

  <div class="bar__right">
    <span id="pending" class="pill" hidden></span>
    <a class="btn btn--gold" href="#publish">Publish</a>
    <span id="who" class="who"></span>
  </div>
</header>

<main id="view" aria-live="polite">
  <div class="loading">Loading…</div>
</main>

<div id="toast" class="toast" hidden></div>

<!-- Blocking confirm dialog, used for anything destructive. -->
<div id="modal" class="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <label id="modalConfirmWrap" hidden>
      <span id="modalConfirmLabel"></span>
      <input type="text" id="modalConfirm" autocomplete="off">
    </label>
    <div class="modal__actions">
      <button type="button" class="btn btn--quiet" id="modalCancel">Cancel</button>
      <button type="button" class="btn btn--danger" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script src="/studio/studio.js"></script>
</body>
</html>
